name: Validate ContentPilot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frontend and Worker JavaScript
        run: node scripts/validate.mjs
      - name: Run Worker request-boundary tests
        run: node --test tests/worker.test.mjs
      - name: Test D1 migration SQL with SQLite
        run: python3 tests/migrations.test.py
